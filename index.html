<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026年5月任务表</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f4;
      --paper: #ffffff;
      --ink: #1f2933;
      --muted: #65717e;
      --line: #d6dbe0;
      --line-strong: #aeb8c2;
      --accent: #0f766e;
      --accent-dark: #0b5d57;
      --accent-soft: #e5f4f2;
      --warn: #b45309;
      --warn-soft: #fff3d6;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(31, 41, 51, 0.12);
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(15, 118, 110, 0) 260px),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink);
      border-radius: 7px;
      min-height: 38px;
      padding: 0 14px;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    button:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .ghost {
      background: transparent;
    }

    .hidden {
      display: none !important;
    }

    .login-view {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-panel {
      width: min(440px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .login-panel h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 760;
    }

    .login-panel p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    .password-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .password-input,
    .search-input {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: 7px;
      min-height: 38px;
      padding: 0 12px;
      outline: none;
    }

    .password-input:focus,
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .login-error {
      margin-top: 12px;
      color: var(--danger);
      min-height: 22px;
      line-height: 1.5;
    }

    .app-view {
      min-height: 100vh;
    }

    .app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .header-inner,
    .main-inner {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
    }

    .header-inner {
      padding: 22px 0 18px;
    }

    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      font-weight: 780;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcfd;
      min-width: 112px;
      padding: 8px 10px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .note {
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 7px 7px 0;
      padding: 10px 12px;
      color: #23413f;
      line-height: 1.55;
      min-height: 64px;
    }

    .main-inner {
      padding: 18px 0 28px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input {
      width: min(320px, calc(100vw - 32px));
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
    }

    .segmented button {
      border: 0;
      border-radius: 0;
      min-height: 36px;
      padding: 0 12px;
      transform: none;
    }

    .segmented button + button {
      border-left: 1px solid var(--line);
    }

    .segmented button.active {
      background: var(--accent);
      color: #fff;
    }

    .status-text {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }

    .table-shell {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(31, 41, 51, 0.08);
      max-height: calc(100vh - 280px);
    }

    table {
      width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 14px;
    }

    col.date-col {
      width: 112px;
    }

    th,
    td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 0;
      height: 42px;
      vertical-align: middle;
      background: #fff;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #f0f3f5;
      color: #17212b;
      font-weight: 740;
      line-height: 1.25;
      text-align: center;
      padding: 7px 8px;
    }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      border-right: 1px solid var(--line-strong);
    }

    th:first-child {
      z-index: 4;
    }

    td:first-child {
      background: #f6f8f9;
      font-family: var(--mono);
      font-size: 13px;
      text-align: center;
      color: #26313d;
      font-weight: 650;
    }

    tbody tr:nth-child(even) td:not(:first-child) {
      background: #fbfbf8;
    }

    tbody tr.review-row td:first-child {
      box-shadow: inset 3px 0 0 var(--warn);
    }

    .cell {
      width: 100%;
      min-height: 41px;
      padding: 9px 8px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .cell:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
      background: #fff;
    }

    .cell.low-confidence {
      background: var(--warn-soft);
      color: #5f3604;
    }

    .summary-cell .cell {
      text-align: left;
    }

    .numeric-cell .cell {
      text-align: center;
    }

    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 22px;
      color: var(--muted);
      background: #fff;
      text-align: center;
    }

    @media (max-width: 900px) {
      .header-inner,
      .main-inner {
        width: min(100vw - 20px, 1480px);
      }

      .notes {
        grid-template-columns: 1fr;
      }

      .password-row {
        grid-template-columns: 1fr;
      }

      h1,
      .login-panel h1 {
        font-size: 24px;
      }

      .table-shell {
        max-height: calc(100vh - 360px);
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .login-view,
      .toolbar,
      .stats {
        display: none !important;
      }

      .app-view,
      .app-header,
      .table-shell {
        display: block !important;
      }

      .header-inner,
      .main-inner {
        width: 100%;
      }

      .table-shell {
        max-height: none;
        overflow: visible;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main id="loginView" class="login-view">
    <section class="login-panel" aria-labelledby="loginTitle">
      <h1 id="loginTitle">2026年5月任务表</h1>
      <p>输入密码后打开在线表格。</p>
      <form id="loginForm" class="password-row">
        <input id="passwordInput" class="password-input" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码">
        <button class="primary" type="submit">打开</button>
      </form>
      <div id="loginError" class="login-error" role="status"></div>
    </section>
  </main>

  <section id="appView" class="app-view hidden" aria-label="在线表格">
    <header class="app-header">
      <div class="header-inner">
        <div class="title-row">
          <div>
            <h1 id="tableTitle">任务表</h1>
            <p id="tableSubtitle" class="subtitle"></p>
          </div>
          <div class="stats" aria-label="统计">
            <div class="stat"><strong id="statDays">0</strong><span>有记录天数</span></div>
            <div class="stat"><strong id="statCells">0</strong><span>已填写单元格</span></div>
            <div class="stat"><strong id="statReview">0</strong><span>待核对</span></div>
          </div>
        </div>
        <div id="notes" class="notes"></div>
      </div>
    </header>

    <div class="main-inner">
      <div class="toolbar">
        <div class="toolbar-left">
          <input id="searchInput" class="search-input" type="search" placeholder="搜索日期、数字或总结" aria-label="搜索">
          <div class="segmented" aria-label="筛选">
            <button type="button" class="active" data-filter="all">全部</button>
            <button type="button" data-filter="filled">已填写</button>
            <button type="button" data-filter="review">待核对</button>
          </div>
        </div>
        <div class="toolbar-right">
          <span id="saveState" class="status-text"></span>
          <button id="exportButton" type="button">导出 CSV</button>
          <button id="resetButton" class="ghost" type="button">重置</button>
        </div>
      </div>
      <div id="tableShell" class="table-shell"></div>
      <div id="emptyState" class="empty-state hidden">没有匹配的记录。</div>
    </div>
  </section>

    };

    const STORAGE_KEY = "photo-task-table-2026-05";
    const els = {
      loginView: document.getElementById("loginView"),
      appView: document.getElementById("appView"),
      loginForm: document.getElementById("loginForm"),
      passwordInput: document.getElementById("passwordInput"),
      loginError: document.getElementById("loginError"),
      title: document.getElementById("tableTitle"),
      subtitle: document.getElementById("tableSubtitle"),
      notes: document.getElementById("notes"),
      tableShell: document.getElementById("tableShell"),
      emptyState: document.getElementById("emptyState"),
      searchInput: document.getElementById("searchInput"),
      saveState: document.getElementById("saveState"),
      exportButton: document.getElementById("exportButton"),
      resetButton: document.getElementById("resetButton"),
      statDays: document.getElementById("statDays"),
      statCells: document.getElementById("statCells"),
      statReview: document.getElementById("statReview")
    };

    const app = {
      data: null,
      rows: [],
      originalRows: [],
      qualityMap: new Set(),
      filter: "all",
      saveTimer: null
    };

    function fromBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function decryptPayload(password) {
      if (!crypto.subtle) {
        throw new Error("当前浏览器不支持安全解密。");
      }

      const encoder = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          salt: fromBase64(ENCRYPTED_PAYLOAD.salt),
          iterations: ENCRYPTED_PAYLOAD.iterations
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(ENCRYPTED_PAYLOAD.iv) },
        key,
        fromBase64(ENCRYPTED_PAYLOAD.ciphertext)
      );

      return JSON.parse(new TextDecoder().decode(plain));
    }

    function getCellValue(cell) {
      return typeof cell === "object" && cell !== null ? cell.v || "" : cell || "";
    }

    function cloneRows(rows) {
      return rows.map((row) => row.map(getCellValue));
    }

    function buildQualityMap(rows) {
      const quality = new Set();
      rows.forEach((row, rowIndex) => {
        row.forEach((cell, columnIndex) => {
          if (typeof cell === "object" && cell !== null && cell.q === "low") {
            quality.add(`${rowIndex}:${columnIndex}`);
          }
        });
      });
      return quality;
    }

    function loadSavedRows() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!Array.isArray(saved) || saved.length !== app.originalRows.length) {
          return null;
        }
        return saved;
      } catch {
        return null;
      }
    }

    function scheduleSave() {
      clearTimeout(app.saveTimer);
      els.saveState.textContent = "保存中";
      app.saveTimer = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(app.rows));
        els.saveState.textContent = "已保存于本机";
      }, 250);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isNumericColumn(key) {
      return !["date", "summary"].includes(key);
    }

    function rowHasContent(row) {
      return row.slice(1).some((cell) => String(cell).trim() !== "");
    }

    function rowNeedsReview(rowIndex) {
      return app.data.columns.some((_, columnIndex) => {
        return app.qualityMap.has(`${rowIndex}:${columnIndex}`) && String(app.rows[rowIndex][columnIndex]).trim() !== "";
      });
    }

    function renderNotes() {
      els.notes.innerHTML = app.data.monthNotes
        .map((note) => `<div class="note">${escapeHtml(note)}</div>`)
        .join("");
    }

    function renderTable() {
      const query = els.searchInput.value.trim().toLowerCase();
      const visibleRows = app.rows
        .map((row, rowIndex) => ({ row, rowIndex }))
        .filter(({ row, rowIndex }) => {
          const searchable = row.join(" ").toLowerCase();
          const matchesSearch = !query || searchable.includes(query);
          const matchesFilter =
            app.filter === "all" ||
            (app.filter === "filled" && rowHasContent(row)) ||
            (app.filter === "review" && rowNeedsReview(rowIndex));
          return matchesSearch && matchesFilter;
        });

      els.emptyState.classList.toggle("hidden", visibleRows.length > 0);
      els.tableShell.classList.toggle("hidden", visibleRows.length === 0);

      const colgroup = app.data.columns
        .map((column, index) => `<col class="${index === 0 ? "date-col" : ""}" style="width:${column.width || 96}px">`)
        .join("");

      const header = app.data.columns
        .map((column) => `<th scope="col">${escapeHtml(column.label)}</th>`)
        .join("");

      const body = visibleRows
        .map(({ row, rowIndex }) => {
          const reviewClass = rowNeedsReview(rowIndex) ? " review-row" : "";
          const cells = app.data.columns
            .map((column, columnIndex) => {
              const value = row[columnIndex] || "";
              const low = app.qualityMap.has(`${rowIndex}:${columnIndex}`) && String(value).trim() !== "";
              const summary = column.key === "summary" ? " summary-cell" : "";
              const numeric = isNumericColumn(column.key) ? " numeric-cell" : "";
              if (column.locked) {
                return `<td class="${summary}${numeric}"><div class="cell">${escapeHtml(value)}</div></td>`;
              }
              return `<td class="${summary}${numeric}">
                <div class="cell${low ? " low-confidence" : ""}" contenteditable="true" spellcheck="false" data-row="${rowIndex}" data-column="${columnIndex}">${escapeHtml(value)}</div>
              </td>`;
            })
            .join("");
          return `<tr class="${reviewClass}">${cells}</tr>`;
        })
        .join("");

      els.tableShell.innerHTML = `<table><colgroup>${colgroup}</colgroup><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>`;
      updateStats();
    }

    function updateStats() {
      const filledDays = app.rows.filter(rowHasContent).length;
      const filledCells = app.rows.reduce((total, row) => {
        return total + row.slice(1).filter((cell) => String(cell).trim() !== "").length;
      }, 0);
      const reviewCells = app.rows.reduce((total, row, rowIndex) => {
        return total + row.filter((cell, columnIndex) => {
          return app.qualityMap.has(`${rowIndex}:${columnIndex}`) && String(cell).trim() !== "";
        }).length;
      }, 0);

      els.statDays.textContent = filledDays;
      els.statCells.textContent = filledCells;
      els.statReview.textContent = reviewCells;
    }

    function unlock(data) {
      app.data = data;
      app.originalRows = cloneRows(data.rows);
      app.rows = loadSavedRows() || cloneRows(data.rows);
      app.qualityMap = buildQualityMap(data.rows);

      els.title.textContent = data.title;
      els.subtitle.textContent = data.subtitle;
      renderNotes();
      renderTable();

      els.loginView.classList.add("hidden");
      els.appView.classList.remove("hidden");
      els.saveState.textContent = localStorage.getItem(STORAGE_KEY) ? "已读取本机保存" : "";
    }

    function exportCsv() {
      const header = app.data.columns.map((column) => column.label);
      const csvRows = [header, ...app.rows].map((row) => {
        return row.map((cell) => `"${String(cell).replaceAll('"', '""')}"`).join(",");
      });
      const blob = new Blob(["\ufeff" + csvRows.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "2026-05-task-table.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    els.loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = els.passwordInput.value;
      els.loginError.textContent = "";
      if (!password) {
        els.loginError.textContent = "请输入密码。";
        return;
      }

      try {
        els.loginForm.querySelector("button").disabled = true;
        const data = await decryptPayload(password);
        unlock(data);
      } catch {
        els.loginError.textContent = "密码不正确。";
      } finally {
        els.loginForm.querySelector("button").disabled = false;
      }
    });

    els.tableShell.addEventListener("input", (event) => {
      const target = event.target;
      if (!target.classList.contains("cell") || !target.dataset.row) {
        return;
      }

      const rowIndex = Number(target.dataset.row);
      const columnIndex = Number(target.dataset.column);
      app.rows[rowIndex][columnIndex] = target.innerText.trim();
      scheduleSave();
      updateStats();
    });

    els.searchInput.addEventListener("input", renderTable);

    document.querySelectorAll(".segmented button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        app.filter = button.dataset.filter;
        renderTable();
      });
    });

    els.exportButton.addEventListener("click", exportCsv);

    els.resetButton.addEventListener("click", () => {
      const confirmed = confirm("重置为照片录入版本？");
      if (!confirmed) {
        return;
      }
      app.rows = cloneRows(app.data.rows);
      localStorage.removeItem(STORAGE_KEY);
      els.saveState.textContent = "已重置";
      renderTable();
    });
  </script>
