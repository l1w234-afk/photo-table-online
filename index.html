<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026&#x5e74;5-6&#x6708;&#x4efb;&#x52a1;&#x8868;</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f4;
      --paper: #ffffff;
      --ink: #1f2933;
      --muted: #65717e;
      --line: #d6dbe0;
      --line-strong: #aeb8c2;
      --accent: #0f766e;
      --accent-dark: #0b5d57;
      --accent-soft: #e5f4f2;
      --warn: #b45309;
      --warn-soft: #fff3d6;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(31, 41, 51, 0.12);
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(15, 118, 110, 0) 260px),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink);
      border-radius: 7px;
      min-height: 38px;
      padding: 0 14px;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    button:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .ghost {
      background: transparent;
    }

    .hidden {
      display: none !important;
    }

    .login-view {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-panel {
      width: min(440px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .login-panel h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 760;
    }

    .login-panel p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    .password-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .password-input,
    .search-input,
    .modal-input {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: 7px;
      min-height: 38px;
      padding: 0 12px;
      outline: none;
    }

    .password-input:focus,
    .search-input:focus,
    .modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .login-error {
      margin-top: 12px;
      color: var(--danger);
      min-height: 22px;
      line-height: 1.5;
    }

    .app-view {
      min-height: 100vh;
    }

    .app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .header-inner,
    .main-inner {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
    }

    .header-inner {
      padding: 22px 0 18px;
    }

    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      font-weight: 780;
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .version-badge {
      border: 1px solid var(--accent);
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      padding: 5px 8px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcfd;
      min-width: 112px;
      padding: 8px 10px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .note {
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 7px 7px 0;
      padding: 10px 12px;
      color: #23413f;
      line-height: 1.55;
      min-height: 64px;
    }

    .main-inner {
      padding: 18px 0 28px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input {
      width: min(320px, calc(100vw - 32px));
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
    }

    .segmented button {
      border: 0;
      border-radius: 0;
      min-height: 36px;
      padding: 0 12px;
      transform: none;
    }

    .segmented button + button {
      border-left: 1px solid var(--line);
    }

    .segmented button.active {
      background: var(--accent);
      color: #fff;
    }

    .status-text {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }

    .table-shell {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(31, 41, 51, 0.08);
      max-height: calc(100svh - 260px);
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 14px;
    }

    col.date-col {
      width: 112px;
    }

    th,
    td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 0;
      height: 42px;
      vertical-align: middle;
      background: #fff;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #f0f3f5;
      color: #17212b;
      font-weight: 740;
      line-height: 1.25;
      text-align: center;
      padding: 7px 8px;
      box-shadow: 0 1px 0 var(--line-strong);
    }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 4;
      border-right: 1px solid var(--line-strong);
    }

    th:first-child {
      z-index: 8;
    }

    td:first-child {
      background: #f6f8f9;
      font-family: var(--mono);
      font-size: 13px;
      text-align: center;
      color: #26313d;
      font-weight: 650;
    }

    tbody tr:nth-child(even) td:not(:first-child) {
      background: #fbfbf8;
    }

    tbody tr.review-row td:first-child {
      box-shadow: inset 3px 0 0 var(--warn);
    }

    .cell {
      width: 100%;
      min-height: 41px;
      padding: 9px 8px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .cell:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
      background: #fff;
    }

    .cell.low-confidence {
      background: var(--warn-soft);
      color: #5f3604;
    }

    .summary-cell .cell {
      text-align: left;
    }

    .numeric-cell .cell {
      text-align: center;
    }

    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 22px;
      color: var(--muted);
      background: #fff;
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.36);
    }

    .modal {
      width: min(440px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal h2 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .modal p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.55;
    }

    .modal-fields {
      display: grid;
      gap: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    @media (max-width: 900px) {
      .header-inner,
      .main-inner {
        width: min(100vw - 16px, 1480px);
      }

      .header-inner {
        padding-top: 14px;
      }

      .title-row {
        align-items: flex-start;
      }

      .notes {
        grid-template-columns: 1fr;
      }

      .stats {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .stat {
        min-width: 0;
        padding: 8px;
      }

      .password-row {
        grid-template-columns: 1fr;
      }

      h1,
      .login-panel h1 {
        font-size: 24px;
      }

      .table-shell {
        max-height: calc(100svh - 360px);
        border-radius: 6px;
      }

      .toolbar,
      .toolbar-left,
      .toolbar-right {
        align-items: stretch;
        width: 100%;
      }

      .toolbar-left {
        display: grid;
        grid-template-columns: 1fr;
      }

      .segmented {
        width: 100%;
      }

      .segmented button {
        flex: 1 1 0;
        padding: 0 8px;
      }

      .search-input {
        width: 100%;
      }

      .toolbar-right button {
        flex: 1 1 auto;
      }
    }

    @media (max-width: 520px) {
      .login-panel {
        padding: 22px;
      }

      .stat span {
        font-size: 11px;
      }

      .table-shell {
        max-height: calc(100svh - 390px);
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .login-view,
      .toolbar,
      .stats {
        display: none !important;
      }

      .app-view,
      .app-header,
      .table-shell {
        display: block !important;
      }

      .header-inner,
      .main-inner {
        width: 100%;
      }

      .table-shell {
        max-height: none;
        overflow: visible;
        box-shadow: none;
      }
    }
  </style>
</head>

          };
        } catch (error) {
          // Fall through to the built-in encrypted table so the original password remains a recovery path.
        }
      }
    
      return {
        data: await decryptPayloadWith(ENCRYPTED_PAYLOAD, password),
        customActive: false
      };
    }
    
    function cellValue(cell) {
      if (cell && typeof cell === "object") {
        return cell.v || "";
      }
      return cell || "";
    }
    
    function normalizeRow(row) {
      return app.data.columns.map((column, index) => {
        const value = row[index];
        return value === undefined || value === null ? "" : value;
      });
    }
    
    function buildQualityMap(data) {
      const quality = new Set();
      if (Array.isArray(data.qualityMap)) {
        data.qualityMap.forEach((item) => quality.add(String(item)));
      }
    
      data.rows.forEach((row, rowIndex) => {
        row.forEach((cell, columnIndex) => {
          if (cell && typeof cell === "object" && cell.q === "low") {
            quality.add(rowIndex + ":" + columnIndex);
          }
        });
      });
      return quality;
    }
    
    function mergeSavedRows(rows) {
      const savedRaw = localStorage.getItem(ROWS_KEY) || localStorage.getItem(LEGACY_ROWS_KEY);
      if (!savedRaw) {
        return {
          rows,
          loaded: false
        };
      }
    
      try {
        const savedRows = JSON.parse(savedRaw);
        if (!Array.isArray(savedRows)) {
          return {
            rows,
            loaded: false
          };
        }
    
        const savedByDate = new Map();
        savedRows.forEach((row) => {
          if (Array.isArray(row) && row.length) {
            savedByDate.set(String(cellValue(row[0])), normalizeRow(row));
          }
        });
    
        const merged = rows.map((row) => savedByDate.get(String(cellValue(row[0]))) || row);
        localStorage.setItem(ROWS_KEY, JSON.stringify(merged));
        return {
          rows: merged,
          loaded: true
        };
      } catch (error) {
        return {
          rows,
          loaded: false
        };
      }
    }
    
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
    
    function rowMonth(row) {
      const value = String(cellValue(row[0]));
      return value.split("/")[0];
    }
    
    function rowHasContent(row) {
      return row.slice(1).some((cell) => String(cellValue(cell)).trim() !== "");
    }
    
    function rowMatchesSearch(row, query) {
      if (!query) {
        return true;
      }
      return row.some((cell) => String(cellValue(cell)).toLowerCase().includes(query));
    }
    
    function rowNeedsReview(rowIndex) {
      const prefix = rowIndex + ":";
      for (const item of app.qualityMap) {
        if (item.startsWith(prefix)) {
          return true;
        }
      }
      return false;
    }
    
    function isNumericColumn(key) {
      return !["date", "m_note", "noon_note", "pm_note", "summary"].includes(key);
    }
    
    function visibleEntries() {
      const query = els.searchInput.value.trim().toLowerCase();
      return app.rows
        .map((row, index) => ({
          row,
          index
        }))
        .filter((entry) => rowMonth(entry.row) === app.month)
        .filter((entry) => rowMatchesSearch(entry.row, query))
        .filter((entry) => {
          if (app.filter === "filled") {
            return rowHasContent(entry.row);
          }
          if (app.filter === "review") {
            return rowNeedsReview(entry.index);
          }
          return true;
        });
    }
    
    function syncMonthButtons() {
      els.monthButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.month === app.month);
      });
    }
    
    function syncFilterButtons() {
      els.filterButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === app.filter);
      });
    }
    
    function updateStats(entries) {
      const scopedEntries = entries || visibleEntries();
      const days = scopedEntries.filter((entry) => rowHasContent(entry.row)).length;
      const cells = scopedEntries.reduce((count, entry) => {
        return count + entry.row.slice(1).filter((cell) => String(cellValue(cell)).trim() !== "").length;
      }, 0);
      const review = scopedEntries.filter((entry) => rowNeedsReview(entry.index)).length;
    
      els.statDays.textContent = String(days);
      els.statCells.textContent = String(cells);
      els.statReview.textContent = String(review);
    }
    
    function renderMeta() {
      els.title.textContent = app.data.title;
      els.subtitle.textContent = app.data.subtitle || "";
      els.versionBadge.textContent = (app.data.version || "1.1") + "\u7248";
      els.notes.innerHTML = (app.data.monthNotes || [])
        .map((note) => "<div class=\"note\">" + escapeHtml(note) + "</div>")
        .join("");
    }
    
    function renderTable() {
      const entries = visibleEntries();
      updateStats(entries);
    
      if (!entries.length) {
        els.tableShell.innerHTML = "";
        els.emptyState.classList.remove("hidden");
        return;
      }
    
      els.emptyState.classList.add("hidden");
    
      const colgroup = "<colgroup>" + app.data.columns
        .map((column, index) => {
          const width = Number(column.width || (index === 0 ? 112 : 96));
          return "<col class=\"" + (index === 0 ? "date-col" : "") + "\" style=\"width:" + width + "px\">";
        })
        .join("") + "</colgroup>";
    
      const header = "<thead><tr>" + app.data.columns
        .map((column) => "<th scope=\"col\">" + escapeHtml(column.label) + "</th>")
        .join("") + "</tr></thead>";
    
      const body = entries.map((entry) => {
        const reviewClass = rowNeedsReview(entry.index) ? " review-row" : "";
        const cells = app.data.columns.map((column, columnIndex) => {
          const value = cellValue(entry.row[columnIndex]);
          if (columnIndex === 0) {
            return "<td>" + escapeHtml(value) + "</td>";
          }
    
          const low = app.qualityMap.has(entry.index + ":" + columnIndex);
          const summary = column.key === "summary" ? " summary-cell" : "";
          const numeric = isNumericColumn(column.key) ? " numeric-cell" : "";
          return "<td class=\"" + summary + numeric + "\"><div class=\"cell" + (low ? " low-confidence" : "") + "\" contenteditable=\"true\" spellcheck=\"false\" data-row=\"" + entry.index + "\" data-column=\"" + columnIndex + "\">" + escapeHtml(value) + "</div></td>";
        }).join("");
        return "<tr class=\"" + reviewClass + "\">" + cells + "</tr>";
      }).join("");
    
      els.tableShell.innerHTML = "<table>" + colgroup + header + "<tbody>" + body + "</tbody></table>";
    }
    
    function dataForSecureSave() {
      return {
        title: app.data.title,
        subtitle: app.data.subtitle,
        version: app.data.version || "1.1",
        monthNotes: app.data.monthNotes || [],
        columns: app.data.columns,
        rows: app.rows,
        qualityMap: Array.from(app.qualityMap)
      };
    }
    
    function scheduleSecureSave() {
      if (!app.customActive || !app.sessionPassword) {
        return;
      }
    
      window.clearTimeout(app.secureSaveTimer);
      app.secureSaveTimer = window.setTimeout(async () => {
        try {
          const payload = await encryptPayload(dataForSecureSave(), app.sessionPassword);
          localStorage.setItem(CUSTOM_PAYLOAD_KEY, JSON.stringify(payload));
        } catch (error) {
          els.saveState.textContent = TEXT.passwordSaveFailed;
        }
      }, 650);
    }
    
    function scheduleSave() {
      window.clearTimeout(app.saveTimer);
      els.saveState.textContent = TEXT.saving;
      app.saveTimer = window.setTimeout(() => {
        try {
          localStorage.setItem(ROWS_KEY, JSON.stringify(app.rows));
          localStorage.removeItem(LEGACY_ROWS_KEY);
          els.saveState.textContent = TEXT.saved;
          scheduleSecureSave();
        } catch (error) {
          els.saveState.textContent = TEXT.passwordSaveFailed;
        }
      }, 250);
    }
    
    function showApp(data, customActive) {
      app.data = data;
      app.customActive = customActive;
      app.qualityMap = buildQualityMap(data);
      app.originalRows = data.rows.map((row) => normalizeRow(row));
      const merged = mergeSavedRows(app.originalRows);
      app.rows = merged.rows;
    
      renderMeta();
      syncMonthButtons();
      syncFilterButtons();
      renderTable();
      els.saveState.textContent = merged.loaded ? TEXT.loadedLocal : "";
      els.loginView.classList.add("hidden");
      els.appView.classList.remove("hidden");
    }
    
    function csvEscape(value) {
      const text = String(cellValue(value)).replace(/\r?\n/g, "\n");
      if (/[",\n]/.test(text)) {
        return "\"" + text.replace(/"/g, "\"\"") + "\"";
      }
      return text;
    }
    
    function exportCsv() {
      const entries = visibleEntries();
      const rows = [
        app.data.columns.map((column) => column.label),
        ...entries.map((entry) => entry.row.map((cell) => cellValue(cell)))
      ];
      const csv = "\ufeff" + rows.map((row) => row.map(csvEscape).join(",")).join("\n");
      const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8"
      });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = TEXT.csvName.replace("{month}", app.month);
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }
    
    function openPasswordModal() {
      els.passwordError.textContent = "";
      els.newPasswordInput.value = "";
      els.confirmPasswordInput.value = "";
      els.passwordModal.classList.remove("hidden");
      window.setTimeout(() => els.newPasswordInput.focus(), 0);
    }
    
    function closePasswordModal() {
      els.passwordModal.classList.add("hidden");
    }
    
    els.loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      els.loginError.textContent = "";
    
      if (!window.crypto || !window.crypto.subtle) {
        els.loginError.textContent = TEXT.cryptoUnsupported;
        return;
      }
    
      const password = els.passwordInput.value;
      if (!password) {
        els.loginError.textContent = TEXT.enterPassword;
        return;
      }
    
      try {
        const result = await readSecurePayload(password);
        app.sessionPassword = password;
        showApp(result.data, result.customActive);
      } catch (error) {
        els.loginError.textContent = TEXT.wrongPassword;
      }
    });
    
    els.tableShell.addEventListener("input", (event) => {
      const target = event.target;
      const cell = target && target.closest ? target.closest(".cell") : null;
      if (!cell) {
        return;
      }
    
      const rowIndex = Number(cell.dataset.row);
      const columnIndex = Number(cell.dataset.column);
      app.rows[rowIndex][columnIndex] = cell.innerText.replace(/\u00a0/g, " ").trim();
      scheduleSave();
      updateStats();
    });
    
    els.tableShell.addEventListener("paste", (event) => {
      const target = event.target;
      const cell = target && target.closest ? target.closest(".cell") : null;
      if (!cell) {
        return;
      }
    
      event.preventDefault();
      const text = event.clipboardData.getData("text/plain");
      document.execCommand("insertText", false, text);
    });
    
    els.searchInput.addEventListener("input", renderTable);
    els.exportButton.addEventListener("click", exportCsv);
    els.passwordButton.addEventListener("click", openPasswordModal);
    els.passwordCancelButton.addEventListener("click", closePasswordModal);
    
    els.passwordModal.addEventListener("click", (event) => {
      if (event.target === els.passwordModal) {
        closePasswordModal();
      }
    });
    
    els.passwordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const nextPassword = els.newPasswordInput.value;
      const confirmPassword = els.confirmPasswordInput.value;
    
      if (nextPassword.length < 4) {
        els.passwordError.textContent = TEXT.passwordTooShort;
        return;
      }
    
      if (nextPassword !== confirmPassword) {
        els.passwordError.textContent = TEXT.passwordMismatch;
        return;
      }
    
      try {
        const payload = await encryptPayload(dataForSecureSave(), nextPassword);
        localStorage.setItem(CUSTOM_PAYLOAD_KEY, JSON.stringify(payload));
        app.sessionPassword = nextPassword;
        app.customActive = true;
        closePasswordModal();
        els.saveState.textContent = TEXT.passwordSaved;
      } catch (error) {
        els.passwordError.textContent = TEXT.passwordSaveFailed;
      }
    });
    
    els.monthButtons.forEach((button) => {
      button.addEventListener("click", () => {
        app.month = button.dataset.month;
        localStorage.setItem(MONTH_KEY, app.month);
        syncMonthButtons();
        renderTable();
      });
    });
    
    els.filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        app.filter = button.dataset.filter;
        syncFilterButtons();
        renderTable();
      });
    });
    
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.passwordModal.classList.contains("hidden")) {
        closePasswordModal();
      }
    });
  </script>
</body>
</html>
